version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v # ✅ Verifica que se está usando Node 22
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - node -v # ✅ Verifica que se está usando Node 22
        - rm -rf node_modules package-lock.json # ✅ Borra archivos previos para evitar conflictos
        - npm install --legacy-peer-deps
        - npx ng version
    build:
      commands:
        - |
          if [[ "$AWS_BRANCH" == "develop" ]]; then
            export NG_ENV="development"
          elif [[ "$AWS_BRANCH" == "main" ]]; then
            export NG_ENV="production"
          else
            export NG_ENV="development" # Por defecto
          fi
          echo "Usando configuración: $NG_ENV"

        - npx ng build --configuration=$NG_ENV
  artifacts:
    baseDirectory: dist/sia-admin/browser
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
